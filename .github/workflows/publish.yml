# Publishes a release to npm when its tag is pushed, then creates the GitHub release.
# Release commits and tags are created by the export bot; the release notes are the tag's commit
# message.

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public --provenance

      - name: Release notes
        run: git log -1 --format=%b "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
